<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title description">
  <title id="title">IMRS Record Ingestion Class Diagram</title>
  <desc id="description">PatientRecord, RecordParser, PIIRedactor, MedicalEntities, and MedicalEntity classes and their relationships.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#536579"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M0,6 L6,1 L12,6 L6,11 Z" fill="#536579" stroke="#536579"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17365d; font-size: 15px; }
      .title { font-size: 25px; font-weight: bold; }
      .box { stroke: #2878b5; stroke-width: 1.5; rx: 7; }
      .name { font-weight: bold; font-size: 17px; }
      .divider { stroke: #8398aa; stroke-width: 1; }
      .edge { fill: none; stroke: #536579; stroke-width: 1.7; marker-end: url(#arrow); }
      .compose { fill: none; stroke: #536579; stroke-width: 1.7; marker-start: url(#diamond); }
      .label { font-size: 13px; fill: #34495e; }
    </style>
  </defs>
  <rect width="1000" height="680" fill="#ffffff"/>
  <text class="title" x="500" y="38" text-anchor="middle">IMRS - Record Ingestion Class Diagram</text>

  <rect class="box" x="45" y="105" width="340" height="220" fill="#d9eafd"/>
  <text class="name" x="215" y="135" text-anchor="middle">PatientRecord</text>
  <line class="divider" x1="45" y1="150" x2="385" y2="150"/>
  <text x="65" y="178">- recordId : String</text>
  <text x="65" y="202">- patientId : String</text>
  <text x="65" y="226">- rawText : String</text>
  <text x="65" y="250">- uploadedAt : DateTime</text>
  <text x="65" y="274">- sourceFileName : String</text>
  <line class="divider" x1="45" y1="288" x2="385" y2="288"/>
  <text x="65" y="313">+ validate() : Boolean</text>

  <rect class="box" x="520" y="80" width="430" height="240" fill="#d9f5df"/>
  <text class="name" x="735" y="110" text-anchor="middle">RecordParser</text>
  <line class="divider" x1="520" y1="125" x2="950" y2="125"/>
  <text x="540" y="153">- extractionEngine : String</text>
  <text x="540" y="177">- language : String</text>
  <line class="divider" x1="520" y1="191" x2="950" y2="191"/>
  <text x="540" y="219">+ extractText(record : PatientRecord) : String</text>
  <text x="540" y="247">+ parseRecord(record : PatientRecord) : MedicalEntities</text>
  <text x="540" y="275">+ validateInput(text : String) : Boolean</text>

  <rect class="box" x="65" y="420" width="300" height="110" fill="#fce4d6"/>
  <text class="name" x="215" y="451" text-anchor="middle">PIIRedactor</text>
  <line class="divider" x1="65" y1="466" x2="365" y2="466"/>
  <text x="85" y="498">+ redact(text : String) : String</text>

  <rect class="box" x="450" y="390" width="300" height="200" fill="#e9ddfb"/>
  <text class="name" x="600" y="420" text-anchor="middle">MedicalEntities</text>
  <line class="divider" x1="450" y1="435" x2="750" y2="435"/>
  <text x="470" y="463">- entities : List&lt;MedicalEntity&gt;</text>
  <text x="470" y="487">- extractedAt : DateTime</text>
  <line class="divider" x1="450" y1="501" x2="750" y2="501"/>
  <text x="470" y="529">+ addEntity(entity : MedicalEntity) : void</text>
  <text x="470" y="553">+ getEntities() : List&lt;MedicalEntity&gt;</text>
  <text x="470" y="577">+ exportToJSON() : String</text>

  <rect class="box" x="790" y="420" width="190" height="145" fill="#e9ddfb"/>
  <text class="name" x="885" y="451" text-anchor="middle">MedicalEntity</text>
  <line class="divider" x1="790" y1="466" x2="980" y2="466"/>
  <text x="805" y="494">- entityType : String</text>
  <text x="805" y="518">- value : String</text>
  <text x="805" y="542">- confidenceScore : Float</text>

  <path class="edge" d="M385 215 L520 215"/>
  <text class="label" x="450" y="205" text-anchor="middle">reads</text>
  <path class="edge" d="M650 320 L650 350 L215 350 L215 420"/>
  <text class="label" x="430" y="343" text-anchor="middle">sanitizes text with</text>
  <path class="edge" d="M820 320 L820 355 L600 355 L600 390"/>
  <text class="label" x="722" y="348" text-anchor="middle">creates</text>
  <path class="compose" d="M750 480 L790 480"/>
  <text class="label" x="752" y="468">1</text>
  <text class="label" x="790" y="504">0..*</text>
</svg>
